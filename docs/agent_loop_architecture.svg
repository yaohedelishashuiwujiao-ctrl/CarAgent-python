<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill:#f8fafc; }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:34px; font-weight:800; fill:#0f172a; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:17px; fill:#475569; }
      .lane-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:18px; font-weight:800; fill:#0f172a; }
      .box-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:19px; font-weight:800; fill:#0f172a; }
      .box-text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:14px; fill:#334155; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:12px; fill:#475569; }
      .tiny { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:11px; fill:#64748b; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size:13px; font-weight:700; fill:#334155; }
      .lane { fill:#ffffff; stroke:#dbe4ee; stroke-width:1.4; rx:22; filter:url(#shadow); }
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:16; filter:url(#shadow); }
      .box-blue { fill:#eff6ff; stroke:#93c5fd; stroke-width:1.7; rx:16; filter:url(#shadow); }
      .box-green { fill:#ecfdf5; stroke:#5eead4; stroke-width:1.7; rx:16; filter:url(#shadow); }
      .box-purple { fill:#f5f3ff; stroke:#c4b5fd; stroke-width:1.7; rx:16; filter:url(#shadow); }
      .box-orange { fill:#fff7ed; stroke:#fdba74; stroke-width:1.7; rx:16; filter:url(#shadow); }
      .box-red { fill:#fef2f2; stroke:#fca5a5; stroke-width:1.7; rx:16; filter:url(#shadow); }
      .arrow { stroke:#334155; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .arrow-blue { stroke:#2563eb; stroke-width:2.4; fill:none; marker-end:url(#arrowBlue); }
      .arrow-green { stroke:#0f766e; stroke-width:2.4; fill:none; marker-end:url(#arrowGreen); }
      .arrow-dash { stroke:#64748b; stroke-width:2; fill:none; stroke-dasharray:7 6; marker-end:url(#arrow); }
      .loop { stroke:#7c3aed; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .note { fill:#fffbeb; stroke:#facc15; stroke-width:1.3; rx:12; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1260"/>
  <text class="title" x="70" y="62">Agent Loop 链路架构图：从用户问题到多轮工具调用与最终结果</text>
  <text class="subtitle" x="70" y="94">基于当前代码：frontend AgentPage → backend agent_runtime proxy → agent_runtime/web_app.py → ClawdREPL → run_agent_loop → Provider / ToolRegistry / Conversation</text>

  <!-- Lanes -->
  <rect class="lane" x="50" y="130" width="320" height="1010"/>
  <text class="lane-title" x="80" y="166">用户与前端</text>

  <rect class="lane" x="400" y="130" width="310" height="1010"/>
  <text class="lane-title" x="430" y="166">FastAPI 平台后端</text>

  <rect class="lane" x="740" y="130" width="420" height="1010"/>
  <text class="lane-title" x="770" y="166">Agent Runtime / Web Harness</text>

  <rect class="lane" x="1190" y="130" width="560" height="1010"/>
  <text class="lane-title" x="1220" y="166">执行内核：LLM + Tools + Memory</text>

  <!-- Frontend -->
  <rect class="box-blue" x="85" y="205" width="250" height="115"/>
  <text class="box-title" x="110" y="238">用户输入问题</text>
  <text class="box-text" x="110" y="267">例如：对比 X9 与 MEGA</text>
  <text class="box-text" x="110" y="291">底盘配置差异，并生成结论</text>

  <rect class="box-blue" x="85" y="365" width="250" height="145"/>
  <text class="box-title" x="110" y="398">AgentPage.tsx</text>
  <text class="box-text" x="110" y="427">1. 追加 user message</text>
  <text class="box-text" x="110" y="451">2. 创建 AbortController</text>
  <text class="box-text" x="110" y="475">3. POST /api/agent/chat_stream</text>
  <text class="small" x="110" y="497">NDJSON 流式读取事件</text>

  <rect class="box-blue" x="85" y="890" width="250" height="160"/>
  <text class="box-title" x="110" y="923">前端实时渲染</text>
  <text class="box-text" x="110" y="952">text_delta：回答逐字显示</text>
  <text class="box-text" x="110" y="976">tool_use / result：过程面板</text>
  <text class="box-text" x="110" y="1000">telemetry：阶段、耗时、统计</text>
  <text class="box-text" x="110" y="1024">final：写入最终消息</text>

  <!-- Backend -->
  <rect class="box-green" x="430" y="365" width="250" height="145"/>
  <text class="box-title" x="455" y="398">agent_runtime.py</text>
  <text class="box-text" x="455" y="427">FastAPI Router</text>
  <text class="box-text" x="455" y="451">POST /api/agent/chat_stream</text>
  <text class="box-text" x="455" y="475">requests.post(..., stream=True)</text>
  <text class="small" x="455" y="497">代理到 CLAWD_AGENT_WEB_URL</text>

  <rect class="box-green" x="430" y="565" width="250" height="125"/>
  <text class="box-title" x="455" y="598">StreamingResponse</text>
  <text class="box-text" x="455" y="627">逐字节转发上游 NDJSON</text>
  <text class="box-text" x="455" y="651">不解析业务内容</text>
  <text class="small" x="455" y="673">让前端保持实时感</text>

  <!-- Web app -->
  <rect class="box-purple" x="775" y="205" width="350" height="150"/>
  <text class="box-title" x="805" y="238">web_app._chat_stream()</text>
  <text class="box-text" x="805" y="267">1. 校验 prompt / session_id</text>
  <text class="box-text" x="805" y="291">2. send_header: application/x-ndjson</text>
  <text class="box-text" x="805" y="315">3. 读取默认 provider / api_key</text>
  <text class="small" x="805" y="337">无 key 时走 route_fallback</text>

  <rect class="box-purple" x="775" y="400" width="350" height="165"/>
  <text class="box-title" x="805" y="433">_get_web_repl(session_id)</text>
  <text class="box-text" x="805" y="462">复用或创建 ClawdREPL</text>
  <text class="box-text" x="805" y="486">Session.load(session_id)</text>
  <text class="box-text" x="805" y="510">设置 workspace_root / cwd</text>
  <text class="box-text" x="805" y="534">Web 权限 handler：默认拒绝需确认动作</text>

  <rect class="box-purple" x="775" y="610" width="350" height="155"/>
  <text class="box-title" x="805" y="643">进入一次用户 Turn</text>
  <text class="box-text" x="805" y="672">conversation.add_user_message(prompt)</text>
  <text class="box-text" x="805" y="696">初始化 tool_events / trace_lines</text>
  <text class="box-text" x="805" y="720">emit telemetry: ingest</text>
  <text class="small" x="805" y="742">会话记忆 → LLM 请求前的可观测事件</text>

  <rect class="box-purple" x="775" y="890" width="350" height="160"/>
  <text class="box-title" x="805" y="923">NDJSON 事件输出</text>
  <text class="box-text" x="805" y="952">on_event → tool_use / tool_result / error</text>
  <text class="box-text" x="805" y="976">on_text_chunk → text_delta</text>
  <text class="box-text" x="805" y="1000">_save_session_with_trace()</text>
  <text class="box-text" x="805" y="1024">final: text + trace + telemetry</text>

  <!-- Core loop -->
  <rect class="box-orange" x="1225" y="190" width="475" height="150"/>
  <text class="box-title" x="1255" y="223">run_agent_loop(conversation, provider, registry, context)</text>
  <text class="box-text" x="1255" y="252">构建 tool_schemas = registry.list_specs()</text>
  <text class="box-text" x="1255" y="276">effective_system_prompt = output style + workspace context</text>
  <text class="box-text" x="1255" y="300">OpenAI-compatible 另维护 openai_messages</text>
  <text class="small" x="1255" y="322">max_turns 默认 Web 侧传 20</text>

  <rect class="box-orange" x="1225" y="380" width="475" height="145"/>
  <text class="box-title" x="1255" y="413">每一轮 LLM 调用</text>
  <text class="box-text" x="1255" y="442">Anthropic/MiniMax：conversation.get_messages()</text>
  <text class="box-text" x="1255" y="466">OpenAI-compatible：system + openai_messages</text>
  <text class="box-text" x="1255" y="490">stream 优先 chat_stream_response，失败回退 chat</text>

  <rect class="box" x="1230" y="565" width="210" height="135"/>
  <text class="box-title" x="1252" y="598">Provider Adapter</text>
  <text class="box-text" x="1252" y="627">Ark / OpenAI / GLM</text>
  <text class="box-text" x="1252" y="651">Anthropic / MiniMax</text>
  <text class="small" x="1252" y="674">统一成 ChatResponse</text>

  <rect class="box" x="1490" y="565" width="210" height="135"/>
  <text class="box-title" x="1512" y="598">ChatResponse</text>
  <text class="box-text" x="1512" y="627">content</text>
  <text class="box-text" x="1512" y="651">usage</text>
  <text class="box-text" x="1512" y="675">tool_uses?</text>

  <rect class="box-red" x="1225" y="740" width="475" height="85"/>
  <text class="box-title" x="1255" y="773">分支判断</text>
  <text class="box-text" x="1255" y="802">没有 tool_uses → add_assistant_message(final text) → return AgentLoopResult</text>

  <rect class="box-red" x="1225" y="860" width="475" height="175"/>
  <text class="box-title" x="1255" y="893">有 tool_uses：ToolRegistry.dispatch()</text>
  <text class="box-text" x="1255" y="922">1. get(name) 找工具</text>
  <text class="box-text" x="1255" y="946">2. context.ensure_tool_allowed()</text>
  <text class="box-text" x="1255" y="970">3. validate_json_schema(input)</text>
  <text class="box-text" x="1255" y="994">4. check_permissions()</text>
  <text class="box-text" x="1255" y="1018">5. tool.run() → ToolResult</text>

  <rect class="box-green" x="1225" y="1070" width="475" height="115"/>
  <text class="box-title" x="1255" y="1103">业务工具环境</text>
  <text class="box-text" x="1255" y="1132">SQL：SubjectsSqlSchema / Glob / Query（只读 + LIMIT）</text>
  <text class="box-text" x="1255" y="1156">知识：KnowledgeSearch / Fetch（平台 RAG 或 RAGFlow）</text>
  <text class="box-text" x="1255" y="1180">Web / 图表 / PPT / 文件 / 任务 / MCP / Skill</text>

  <!-- Side memory/context -->
  <rect class="box" x="1210" y="40" width="250" height="90"/>
  <text class="box-title" x="1235" y="72">Conversation</text>
  <text class="small" x="1235" y="100">user / assistant / tool_use / tool_result</text>

  <rect class="box" x="1495" y="40" width="230" height="90"/>
  <text class="box-title" x="1520" y="72">ToolContext</text>
  <text class="small" x="1520" y="100">workspace / cwd / permission / tasks</text>

  <!-- Arrows main -->
  <path class="arrow-blue" d="M210 320 L210 360"/>
  <path class="arrow-blue" d="M335 438 L425 438"/>
  <path class="arrow-green" d="M555 510 L555 560"/>
  <path class="arrow-green" d="M680 438 L770 280"/>
  <path class="arrow" d="M950 355 L950 395"/>
  <path class="arrow" d="M950 565 L950 605"/>
  <path class="arrow-blue" d="M1125 690 L1220 265"/>
  <path class="arrow" d="M1462 340 L1462 375"/>
  <path class="arrow" d="M1462 525 L1462 560"/>
  <path class="arrow" d="M1440 632 L1485 632"/>
  <path class="arrow" d="M1595 700 L1595 735"/>
  <path class="arrow" d="M1462 825 L1462 855"/>
  <path class="arrow-green" d="M1462 1035 L1462 1065"/>

  <!-- Loop arrows -->
  <path class="loop" d="M1225 950 C1135 950 1135 430 1220 430"/>
  <text class="label" x="1042" y="690" transform="rotate(-90 1042,690)">ToolResult / observation 回灌，进入下一轮 LLM</text>

  <path class="arrow-dash" d="M1225 780 C1165 780 1165 955 775 955"/>
  <path class="arrow-dash" d="M775 970 C590 970 590 970 340 970"/>
  <text class="label" x="485" y="945">最终回答和过程事件反向流式返回</text>

  <path class="arrow-dash" d="M1225 240 L1458 130"/>
  <path class="arrow-dash" d="M1495 86 L1500 190"/>
  <path class="arrow-dash" d="M1335 130 L1335 190"/>

  <!-- Notes -->
  <rect class="note" x="75" y="1080" width="1040" height="105"/>
  <text class="box-title" x="105" y="1114">多轮对话时会发生什么？</text>
  <text class="box-text" x="105" y="1143">同一个 session_id 会复用 WEB_REPLS 中的 ClawdREPL，并从 Session.load() 恢复历史 Conversation；每次用户新问题都会 append 一条 user message。</text>
  <text class="box-text" x="105" y="1167">loop 会携带历史消息、系统提示和工具 schema 继续推理；工具结果作为 observation 写回上下文，因此后续回答能基于前面查到的数据继续工作。</text>

  <rect class="note" x="75" y="540" width="250" height="170"/>
  <text class="box-title" x="105" y="574">前端看到的状态</text>
  <text class="box-text" x="105" y="604">ingest：理解问题</text>
  <text class="box-text" x="105" y="628">tool_use：调用工具</text>
  <text class="box-text" x="105" y="652">tool_result：结果回流</text>
  <text class="box-text" x="105" y="676">stream：生成回答</text>
  <text class="box-text" x="105" y="700">final：任务完成</text>

  <rect class="note" x="1210" y="1205" width="500" height="38"/>
  <text class="small" x="1235" y="1229">失控防护：max_turns、SQL 只读、WebSearch 失败熔断、WebFetch 去重、重复工具失败阻断、预算耗尽后 no-tool synthesis。</text>
</svg>
